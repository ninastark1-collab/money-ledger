<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #03040a;
    --panel: #070a12;
    --panel-2: #0b1020;
    --line: rgba(0,240,255,.14);
    --line-strong: rgba(0,240,255,.4);
    --text: #e8f6ff;
    --muted: #7d8ba3;
    --dim: #45506a;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --red: #ff3b6b;
    --amber: #ffcc00;
    --income: var(--cyan);
    --expense: var(--red);
    --mono: "JetBrains Mono", ui-monospace, "Pretendard", monospace;
    --display: "Orbitron", "Pretendard", sans-serif;
    --cut: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; color: var(--text); min-height: 100vh;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 500px at 85% -5%, rgba(0,240,255,.12), transparent 60%),
      radial-gradient(800px 500px at -5% 30%, rgba(255,43,214,.09), transparent 60%),
      linear-gradient(rgba(0,240,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.045) 1px, transparent 1px);
    background-size: auto, auto, 44px 44px, 44px 44px;
    background-attachment: fixed;
  }
  /* 스캔라인 */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  ::selection { background: var(--cyan); color: #000; }
  .mono { font-family: var(--mono); }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px 80px; }

  /* ===== Header ===== */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 22px 0; margin-bottom: 40px; border-bottom: 1px solid var(--line); position: relative;
  }
  header::after {
    content: ""; position: absolute; left: 0; bottom: -1px; width: 180px; height: 1px;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 44px; height: 44px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--cyan);
    border: 1px solid var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.35), inset 0 0 12px rgba(0,240,255,.2);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    text-shadow: 0 0 10px var(--cyan);
  }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .brand .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--muted); margin-top: 3px; }
  .hdr-right { display: flex; align-items: center; gap: 18px; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .bgm-btn {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; transition: .2s;
  }
  .bgm-btn:hover { border-color: var(--line-strong); color: var(--text); }
  .bgm-btn.on { color: var(--magenta); border-color: var(--magenta); box-shadow: 0 0 14px rgba(255,43,214,.35), inset 0 0 10px rgba(255,43,214,.15); }
  .bgm-btn #bgmLabel { line-height: 1; }
  .bgm-btn .bgm-note { display: block; flex-shrink: 0; }
  .bgm-btn.on .bgm-note { animation: noteBounce .6s ease-in-out infinite alternate; filter: drop-shadow(0 0 4px currentColor); }
  @keyframes noteBounce { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .month-nav button {
    background: transparent; border: 1px solid var(--line); color: var(--cyan);
    width: 34px; height: 34px; cursor: pointer; transition: .2s; font-family: var(--mono); font-size: 16px;
  }
  .month-nav button:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.4); }
  .month-nav span { min-width: 110px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .08em; }

  /* ===== Hero ===== */
  .label { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .label .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim); }
  .hero { margin-bottom: 36px; }
  .slogan {
    display: inline-block; margin-bottom: 26px; padding: 10px 22px;
    font-size: clamp(20px, 4vw, 30px); font-weight: 900; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    border: 1px solid var(--line-strong); position: relative;
    filter: drop-shadow(0 0 10px rgba(0,240,255,.45));
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    animation: sloganGlow 2.4s ease-in-out infinite;
  }
  @keyframes sloganGlow { 50% { filter: drop-shadow(0 0 18px rgba(255,43,214,.6)); } }
  .hero .balance {
    font-family: var(--display); font-weight: 900; line-height: 1; letter-spacing: -.01em;
    font-size: clamp(44px, 8.5vw, 96px); margin: 14px 0 28px;
    color: var(--text); text-shadow: 0 0 28px rgba(0,240,255,.45), 0 0 2px rgba(0,240,255,.9);
  }
  .hero .balance .unit { font-family: "Pretendard", sans-serif; font-size: .32em; font-weight: 600; color: var(--muted); margin-left: 10px; text-shadow: none; }
  .hero .balance.neg { color: var(--red); text-shadow: 0 0 28px rgba(255,59,107,.5); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat { padding: 16px 18px; border: 1px solid var(--line); background: rgba(7,10,18,.6); position: relative; }
  .stat::before { content: ""; position: absolute; left: -1px; top: -1px; width: 10px; height: 10px; border-left: 2px solid var(--cyan); border-top: 2px solid var(--cyan); }
  .stat strong { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; margin-top: 10px; white-space: nowrap; }
  .stat .bar { height: 3px; background: rgba(255,255,255,.06); margin-top: 12px; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .c-income { color: var(--income); text-shadow: 0 0 14px rgba(0,240,255,.45); }
  .c-expense { color: var(--expense); text-shadow: 0 0 14px rgba(255,59,107,.45); }

  /* ===== Panels ===== */
  .grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; margin-bottom: 20px; }
  .grid > *, .row > *, .fc-metrics > * { min-width: 0; }
  .panel {
    position: relative; padding: 26px; isolation: isolate;
    background: linear-gradient(135deg, rgba(0,240,255,.55), rgba(0,240,255,.1) 28%, rgba(255,43,214,.1) 72%, rgba(255,43,214,.5));
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
  }
  .panel::before {
    content: ""; position: absolute; inset: 1px; z-index: -1;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    clip-path: polygon(0 0, calc(100% - var(--cut) + .5px) 0, 100% calc(var(--cut) - .5px), 100% 100%, calc(var(--cut) - .5px) 100%, 0 calc(100% - var(--cut) + .5px));
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 22px; }
  .panel-head h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
  .panel-head h2::before { content: "//"; font-family: var(--mono); color: var(--cyan); font-size: 14px; text-shadow: 0 0 8px var(--cyan); }
  .panel-head .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--dim); }

  /* ===== Form ===== */
  form.entry { display: grid; gap: 14px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); padding: 3px; gap: 3px; }
  .seg label { text-align: center; padding: 10px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); transition: .2s; }
  .seg input { display: none; }
  .seg label:has(input[value=expense]:checked) { background: var(--red); color: #fff; box-shadow: 0 0 18px rgba(255,59,107,.5); }
  .seg label:has(input[value=income]:checked) { background: var(--cyan); color: #000; box-shadow: 0 0 18px rgba(0,240,255,.5); }
  .field { display: grid; gap: 6px; }
  .field > label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select {
    width: 100%; padding: 12px 14px; background: rgba(0,0,0,.5); color: var(--text);
    border: 1px solid var(--line); border-radius: 0; font-size: 15px; font-family: inherit;
    outline: none; transition: border-color .2s, box-shadow .2s; color-scheme: dark;
  }
  input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(0,240,255,.25); }
  input.amount { font-family: var(--display); font-size: 26px; font-weight: 700; padding: 14px; }
  .btn {
    padding: 15px 20px; border: none; cursor: pointer; font-family: inherit;
    background: var(--cyan); color: #000; font-weight: 800; font-size: 15px; letter-spacing: .06em;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    transition: filter .2s, transform .1s;
  }
  .btn:hover { filter: drop-shadow(0 0 12px rgba(0,240,255,.8)) brightness(1.1); }
  .btn:active { transform: scale(.985); }
  .btn.sm { padding: 8px 14px; font-size: 12px; }
  .ghost {
    background: transparent; border: 1px solid var(--line-strong); color: var(--cyan); padding: 7px 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; cursor: pointer; transition: .2s;
  }
  .ghost:hover { background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }

  /* ===== Forecast ===== */
  .fc-metrics { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .fc-metrics .m { border-left: 2px solid var(--line-strong); padding-left: 12px; }
  .fc-metrics .m:first-child { border-color: var(--magenta); }
  .fc-metrics .m span { font-size: 12px; color: var(--muted); }
  .fc-metrics .m strong { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; margin-top: 6px; white-space: nowrap; }
  .fc-metrics .m:first-child strong { font-size: 22px; color: var(--magenta); text-shadow: 0 0 14px rgba(255,43,214,.5); }
  .fc-chart { overflow: hidden; padding: 6px 0; }
  .fc-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .fc-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .fc-legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 10px; }

  /* ===== Budget ===== */
  .gauges { display: grid; gap: 16px; }
  .gauge .g-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; }
  .gauge .g-pct { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .gauge .g-track { height: 8px; margin: 8px 0 6px; background: rgba(255,255,255,.05); position: relative; overflow: hidden; }
  .gauge .g-track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, var(--panel) 9px 11px); }
  .gauge .g-track i { display: block; height: 100%; transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .gauge .g-track .mark80 { position: absolute; left: 80%; top: -2px; bottom: -2px; width: 1px; background: var(--amber); opacity: .6; z-index: 1; }
  .gauge .g-sub { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .gauge.ok .g-track i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); } .gauge.ok .g-pct { color: var(--cyan); }
  .gauge.warn .g-track i { background: var(--amber); box-shadow: 0 0 10px var(--amber); } .gauge.warn .g-pct { color: var(--amber); }
  .gauge.over .g-track i { background: var(--red); box-shadow: 0 0 12px var(--red); } .gauge.over .g-pct { color: var(--red); }
  .gauge.over .g-pct::before { content: "OVER "; font-size: 10px; letter-spacing: .15em; animation: blink 1s infinite; }
  .gauge.big { padding: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.35); }
  .gauge.big .g-top { font-size: 15px; }
  .gauge.big .g-pct { font-size: 22px; }
  .gauge.big .g-track { height: 12px; }
  .allow { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .allow b { font-family: var(--display); color: var(--cyan); font-size: 15px; text-shadow: 0 0 10px rgba(0,240,255,.5); }

  /* ===== Donut ===== */
  .breakdown { display: grid; grid-template-columns: 190px 1fr; gap: 26px; align-items: center; }
  .donut { width: 190px; height: 190px; border-radius: 50%; position: relative; filter: drop-shadow(0 0 14px rgba(0,240,255,.25)); }
  .donut::after { content: ""; position: absolute; inset: 20px; background: var(--panel); border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,240,255,.15); }
  .donut .center { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; text-align: center; }
  .donut .center span { font-size: 11px; color: var(--muted); }
  .donut .center strong { font-family: var(--display); font-size: 17px; font-weight: 700; margin-top: 4px; }
  .legend { display: grid; gap: 11px; }
  .legend-row { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 10px; font-size: 14px; }
  .legend-row .dot { width: 10px; height: 10px; }
  .legend-row .v { font-family: var(--mono); font-weight: 600; font-size: 13px; }
  .legend-row .pct { font-family: var(--mono); color: var(--muted); width: 40px; text-align: right; font-size: 12px; }

  /* ===== List ===== */
  .filters { display: flex; gap: 6px; }
  .chip { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; transition: .2s; font-family: inherit; }
  .chip:hover { color: var(--text); border-color: var(--line-strong); }
  .chip.on { color: var(--cyan); border-color: var(--cyan); box-shadow: inset 0 0 12px rgba(0,240,255,.2), 0 0 10px rgba(0,240,255,.2); }
  ul { list-style: none; padding: 0; margin: 0; }
  .day { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); padding: 16px 0 6px; border-bottom: 1px dashed rgba(0,240,255,.1); margin-bottom: 4px; }
  .item { display: grid; grid-template-columns: 40px 1fr auto 30px; align-items: center; gap: 14px; padding: 12px 10px; margin: 0 -10px; transition: background .2s; border-left: 2px solid transparent; }
  .item:hover { background: rgba(0,240,255,.04); border-left-color: var(--cyan); }
  .item .ico { width: 40px; height: 40px; display: grid; place-items: center; font-size: 14px; font-weight: 800; border: 1px solid var(--line); background: rgba(0,0,0,.4); }
  .item.income .ico { color: var(--income); border-color: rgba(0,240,255,.35); }
  .item.expense .ico { color: var(--expense); border-color: rgba(255,59,107,.35); }
  .item .memo { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .cat { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .item .amt { font-family: var(--mono); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .item.income .amt { color: var(--income); }
  .item .del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 20px; opacity: 0; transition: .2s; }
  .item:hover .del { opacity: 1; } .item .del:hover { color: var(--red); }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }
  .empty .btn { margin-top: 14px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 24px; }
  .tools .ghost.danger { color: var(--red); border-color: rgba(255,59,107,.4); }
  .tools .ghost.danger:hover { background: rgba(255,59,107,.08); box-shadow: 0 0 12px rgba(255,59,107,.3); }

  /* ===== Dialog ===== */
  dialog {
    border: 1px solid var(--cyan); background: var(--panel-2); color: var(--text); padding: 28px; width: min(520px, calc(100vw - 32px));
    box-shadow: 0 0 40px rgba(0,240,255,.25);
  }
  dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(3px); }
  dialog h3 { margin: 0 0 6px; font-size: 18px; } dialog h3::before { content: "// "; color: var(--cyan); font-family: var(--mono); }
  dialog .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

  /* ===== Toast ===== */
  #toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; }
  .toast {
    padding: 12px 16px; background: rgba(7,10,18,.95); border: 1px solid var(--cyan); border-left-width: 4px;
    font-size: 14px; font-weight: 600; box-shadow: 0 0 20px rgba(0,240,255,.25); animation: tin .3s ease both; max-width: 320px;
  }
  .toast.warn { border-color: var(--amber); box-shadow: 0 0 20px rgba(255,204,0,.25); }
  .toast.danger { border-color: var(--red); box-shadow: 0 0 20px rgba(255,59,107,.35); }
  .toast.out { animation: tout .4s ease both; }
  @keyframes tin { from { opacity: 0; transform: translateX(30px); } }
  @keyframes tout { to { opacity: 0; transform: translateX(30px); } }

  .fade-in { animation: fade .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }

  .btn:disabled { opacity: .5; cursor: wait; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .stat strong { font-size: 18px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px 60px; }
    .status { display: none; }
    .panel { padding: 20px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat { min-width: 0; padding: 14px 12px; }
    .row { grid-template-columns: 1fr; }
    .stat strong { font-size: 14px; }
    .fc-metrics .m strong { font-size: 15px; white-space: normal; word-break: keep-all; }
    .fc-metrics .m:first-child strong { font-size: 19px; }
    .wrap { overflow-x: hidden; }
    .stats .stat:last-child { grid-column: 1 / -1; }
    .fc-metrics { grid-template-columns: 1fr 1fr; }
    .fc-metrics .m:first-child { grid-column: 1 / -1; }
    .breakdown { grid-template-columns: 1fr; justify-items: center; }
    .legend { width: 100%; }
    .item .del { opacity: 1; }
    .bgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">₩</div>
      <div>
        <h1>나의 가계부</h1>
        <div class="sub">PERSONAL FINANCE TERMINAL</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="status" title="데이터는 Supabase 클라우드에 저장됩니다"><span class="dot" id="syncDot"></span><span><span id="syncState">CLOUD</span> · <span id="clock">--:--:--</span></span></div>      <button class="bgm-btn" id="bgmBtn" title="배경음악 켜기/끄기" aria-label="배경음악 켜기/끄기">
        <svg class="bgm-note" viewBox="0 0 12 16" width="12" height="16" aria-hidden="true"><g fill="currentColor"><ellipse cx="4.6" cy="13" rx="3.4" ry="2.4" transform="rotate(-22 4.6 13)"/><rect x="6.9" y="1" width="1.4" height="12"/><path d="M8.3 1c0 2.2 3.7 2.9 3.7 5.8-.7-1.7-2-2.5-3.7-2.8z"/><path d="M8.3 4.6c0 2.2 3.7 2.9 3.7 5.8-.7-1.7-2-2.5-3.7-2.8z"/></g></svg><span id="bgmLabel">BGM</span>
      </button>
      <div class="month-nav">
        <button id="prev" aria-label="이전 달">‹</button>

  <section class="hero fade-in">

        <button class="chip" data-f="income">수입</button>
        <button class="chip" data-f="expense">지출</button>

<dialog id="budgetDlg">
  <form method="dialog" id="budgetForm">
    <h3>월 예산 설정</h3>
    <p class="hint">매달 똑같이 적용됩니다. 비워두면 해당 예산은 사용하지 않아요.</p>
    <div class="field"><label>전체 월 예산</label><input class="money" data-b="total" inputmode="numeric" placeholder="예: 1,500,000"></div>
    <div class="bgrid" id="budgetCats"></div>
    <div class="dlg-actions">
      <button class="ghost" value="cancel">취소</button>
      <button class="btn sm" value="save">저장</button>
    </div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
const STORAGE_KEY = 'simple-ledger-v1';
const BUDGET_KEY = 'simple-ledger-budgets-v1';
const CATEGORIES = {
  expense: ['식비', '교통', '쇼핑', '주거/통신', '의료', '문화/여가', '교육', '기타'],
  income: ['월급', '용돈', '부수입', '기타']
};
const FIXED_CATS = ['주거/통신'];   // 월 1회성 고정지출 (예측 시 일평균에서 제외)
const PALETTE =['#00f0ff', '#ff2bd6', '#8b5cf6', '#ffcc00', '#39ff88', '#3d7bff', '#ff3b6b', '#9aa4b8'];
const WEEK = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const won = n => fmt(n) + '원';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseMoney = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= Supabase ================= */
const SUPABASE_URL = 'https://gfcylhusujdvzsoinwoj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KoeaGtIELKu9b4FarAe72g_qk4SrE3L';  // 공개용 키 (로그인 없이 공용 가계부)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const COLS = 'id,type,date,category,amount,memo,created_at';

// 예전(localStorage) 버전 데이터를 계정으로 옮길 때만 사용
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}

let items = [];
let budgets = { total: 0, cats: {} };
let current = new Date(); current.setDate(1);
let filter = 'all';

const fromRow = r => ({ id: r.id, type: r.type, date: r.date, category: r.category, amount: Number(r.amount), memo: r.memo || '', created: r.created_at });
const toRow = i => ({ type: i.type, date: i.date, category: i.category, amount: Math.round(Number(i.amount)), memo: i.memo || '' });

function setSync(text, ok = true) {
  $('syncState').textContent = text;
  $('syncDot').style.background = ok ? '' : 'var(--red)';
}

async function loadData() {
  setSync('SYNC…');
  const [t, b] = await Promise.all([
    sb.from('transactions').select(COLS).order('date', { ascending: false }),
    sb.from('budgets').select('total,cats').maybeSingle()
  ]);
  if (t.error || b.error) {
    setSync('OFFLINE', false);
    toast('데이터를 불러오지 못했어요: ' + (t.error || b.error).message, 'danger');
    return;
  }
  items = t.data.map(fromRow);
  budgets = b.data ? { total: Number(b.data.total), cats: b.data.cats || {} } : { total: 0, cats: {} };
  setSync('CLOUD');
  render();
  await offerLocalMigration();
}

async function saveBudgets(next) {
  const { error } = await sb.from('budgets').upsert({ id: 1, total: next.total || 0, cats: next.cats || {}, updated_at: new Date().toISOString() });
  if (error) { toast('예산 저장 실패: ' + error.message, 'danger'); return false; }
  budgets = { total: next.total || 0, cats: next.cats || {} };
  return true;
}

// 예전 버전에서 이 브라우저에 저장해 둔 기록이 있으면 계정으로 옮기기
async function offerLocalMigration() {
  const local = loadJSON(STORAGE_KEY, []);
  if (!Array.isArray(local) || !local.length || items.length) return;
  if (!confirm(`이 브라우저에 예전 기록 ${local.length}건이 있어요. 클라우드로 옮길까요?`)) return;
  const { data, error } = await sb.from('transactions').insert(local.map(toRow)).select(COLS);
  if (error) { toast('옮기기 실패: ' + error.message, 'danger'); return; }
  items = data.map(fromRow);
  const lb = loadJSON(BUDGET_KEY, null);
  if (lb && !budgets.total && !Object.keys(budgets.cats).length) await saveBudgets(lb);
  try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(BUDGET_KEY); } catch {}
  toast(`${data.length}건을 클라우드로 옮겼어요.`);
  render();
}
const getType = () => document.querySelector('input[name=type]:checked').value;
const monthKey = () => `${current.getFullYear()}-${pad(current.getMonth()+1)}`;

function fillCategories() {
  $('category').innerHTML = CATEGORIES[getType()].map(c => `<option>${c}</option>`).join('');
}

function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('toasts').append(el);
  setTimeout(() => el.classList.add('out'), 3200);
  setTimeout(() => el.remove(), 3600);
}

// 숫자 카운트업
const lastVals = {};
function countTo(el, target, unitHtml) {
  const from = lastVals[el.id] ?? 0; lastVals[el.id] = target;
  const start = performance.now(), dur = 650;
  const step = t => {
    const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
    const v = from + (target - from) * e;
    if (unitHtml) el.innerHTML = fmt(v) + unitHtml; else el.textContent = won(v);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// 보고 있는 달이 과거/현재/미래인지
function monthState() {
  const now = new Date();
  const a = current.getFullYear() * 12 + current.getMonth(), b = now.getFullYear() * 12 + now.getMonth();
  return a < b ? 'past' : a > b ? 'future' : 'current';
}
const daysInMonth = () => new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate();

/* ================= Render ================= */
function render() {
  $('monthLabel').textContent = `${current.getFullYear()}.${pad(current.getMonth()+1)}`;
  const monthItems = items.filter(i => i.date.startsWith(monthKey()));
  const expItems = monthItems.filter(i => i.type === 'expense');
  const inc = monthItems.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);
  const exp = expItems.reduce((s, i) => s + i.amount, 0);
  const bal = inc - exp;

  countTo($('sumIncome'), inc);
  countTo($('sumExpense'), exp);
  countTo($('sumBalance'), bal, '<span class="unit">원</span>');
  $('sumBalance').classList.toggle('neg', bal < 0);
  const max = Math.max(inc, exp, 1);
  $('barIncome').style.width = (inc / max * 100) + '%';
  $('barExpense').style.width = (exp / max * 100) + '%';
  const rate = inc > 0 ? Math.round(bal / inc * 100) : null;
  $('saveRate').textContent = rate === null ? '—' : rate + '%';
  $('saveRate').className = rate !== null && rate < 0 ? 'c-expense' : '';
  $('barRate').style.width = rate === null ? '0' : Math.max(0, Math.min(100, rate)) + '%';

  const byCat = {};
  expItems.forEach(i => byCat[i.category] = (byCat[i.category] || 0) + i.amount);

  renderList(monthItems);
  renderDonut(byCat, exp);
  renderBudget(byCat, exp);
  renderForecast(expItems, exp, inc);
}

function renderList(monthItems) {
  const shown = monthItems.filter(i => filter === 'all' || i.type === filter)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));
  if (!shown.length) { $('list').innerHTML = '<li class="empty">이 달의 기록이 없습니다.</li>'; return; }
  let html = '', lastDate = '';
  for (const i of shown) {
    if (i.date !== lastDate) {
      const d = new Date(i.date + 'T00:00');
      html += `<li class="day">${pad(d.getMonth()+1)}.${pad(d.getDate())} · ${WEEK[d.getDay()]}</li>`;
      lastDate = i.date;
    }
    html += `
    <li class="item ${i.type}">
      <div class="ico">${escapeHtml(i.category.slice(0, 1))}</div>
      <div style="min-width:0">
        <div class="memo">${escapeHtml(i.memo || i.category)}</div>
        <div class="cat">${escapeHtml(i.category)}</div>
      </div>
      <div class="amt">${i.type === 'income' ? '+' : '−'}${won(i.amount)}</div>
      <button class="del" data-id="${i.id}" title="삭제">×</button>
    </li>`;
  }
  $('list').innerHTML = html;
}

function renderDonut(byCat, exp) {
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { $('chart').innerHTML = '<div class="empty">지출 기록이 없습니다.</div>'; return; }
  let acc = 0;
  const stops = entries.map(([, v], idx) => {
    const s = acc / exp * 360; acc += v; const e = acc / exp * 360;
    return `${PALETTE[idx % PALETTE.length]} ${s}deg ${Math.max(s, e - 1)}deg, transparent ${Math.max(s, e - 1)}deg ${e}deg`;
  }).join(',');
  $('chart').innerHTML = `
    <div class="breakdown">
      <div class="donut" style="background:conic-gradient(${stops})">
        <div class="center"><span>총 지출</span><strong>${won(exp)}</strong></div>
      </div>
      <div class="legend">
        ${entries.map(([c, v], idx) => `
          <div class="legend-row">
            <span class="dot" style="background:${PALETTE[idx % PALETTE.length]};box-shadow:0 0 6px ${PALETTE[idx % PALETTE.length]}"></span>
            <span>${escapeHtml(c)}</span>
            <span class="v">${won(v)}</span>
            <span class="pct">${Math.round(v / exp * 100)}%</span>
          </div>`).join('')}
      </div>
    </div>`;
}

/* ================= 예산 ================= */
function gauge(name, spent, budget, big = false) {
  const p = spent / budget;
  const cls = p >= 1 ? 'over' : p >= .8 ? 'warn' : 'ok';
  const remain = budget - spent;
  return `
  <div class="gauge ${cls} ${big ? 'big' : ''}">
    <div class="g-top"><span>${escapeHtml(name)}</span><span class="g-pct">${Math.round(p * 100)}%</span></div>
    <div class="g-track"><span class="mark80"></span><i style="width:${Math.min(100, p * 100)}%"></i></div>
    <div class="g-sub"><span>${won(spent)} / ${won(budget)}</span><span>${remain >= 0 ? '남음 ' + won(remain) : won(-remain) + ' 초과'}</span></div>
  </div>`;
}

function renderBudget(byCat, exp) {
  const catBudgets = Object.entries(budgets.cats).filter(([, v]) => v > 0);
  if (!budgets.total && !catBudgets.length) {
    $('budget').innerHTML = `<div class="empty">아직 예산이 없어요.<br>예산을 정하면 80%에서 주의, 100%에서 경고를 보여드려요.<br><button class="btn sm" onclick="openBudget()">예산 설정하기</button></div>`;
    return;
  }
  let html = '<div class="gauges">';
  if (budgets.total) {
    html += gauge('전체 예산', exp, budgets.total, true);
    if (monthState() === 'current') {
      const today = new Date().getDate(), left = daysInMonth() - today + 1;
      const remain = budgets.total - exp;
      html += remain > 0
        ? `<div class="allow">남은 ${left}일 동안 하루 <b>${won(remain / left)}</b>씩 쓸 수 있어요.</div>`
        : `<div class="allow" style="color:var(--red)">이번 달 예산을 모두 사용했어요.</div>`;
    }
  }
  catBudgets
    .sort((a, b) => (byCat[b[0]] || 0) / b[1] - (byCat[a[0]] || 0) / a[1])
    .forEach(([c, b]) => html += gauge(c, byCat[c] || 0, b));
  $('budget').innerHTML = html + '</div>';
}

function openBudget() {
  $('budgetCats').innerHTML = CATEGORIES.expense.map(c => `
    <div class="field"><label>${c}</label>
      <input class="money" data-b="${c}" inputmode="numeric" placeholder="없음" value="${budgets.cats[c] ? fmt(budgets.cats[c]) : ''}">
    </div>`).join('');
  document.querySelector('[data-b=total]').value = budgets.total ? fmt(budgets.total) : '';
  $('budgetDlg').showModal();
}
$('budgetBtn').onclick = openBudget;
$('budgetDlg').addEventListener('close', async () => {
  if ($('budgetDlg').returnValue !== 'save') return;
  const next = { total: 0, cats: {} };
  document.querySelectorAll('#budgetForm [data-b]').forEach(inp => {
    const v = parseMoney(inp.value);
    if (inp.dataset.b === 'total') next.total = v; else if (v) next.cats[inp.dataset.b] = v;
  });
  if (await saveBudgets(next)) { toast('예산이 저장되었습니다.'); render(); }
});

// 기록 직후 예산 경고
function budgetAlerts(item) {
  if (item.type !== 'expense') return false;
  const mk = item.date.slice(0, 7);
  const monthExp = items.filter(i => i.type === 'expense' && i.date.startsWith(mk));
  const total = monthExp.reduce((s, i) => s + i.amount, 0);
  const cat = monthExp.filter(i => i.category === item.category).reduce((s, i) => s + i.amount, 0);
  let fired = false;
  const check = (label, after, budget) => {
    if (!budget) return;
    const pb = (after - item.amount) / budget, pa = after / budget;
    if (pb < 1 && pa >= 1) { toast(`⚠ ${label} 예산 초과! (${Math.round(pa * 100)}%)`, 'danger'); fired = true; }
    else if (pb < .8 && pa >= .8) { toast(`${label} 예산의 ${Math.round(pa * 100)}%를 사용했어요.`, 'warn'); fired = true; }
  };
  check(item.category, cat, budgets.cats[item.category]);
  check('전체', total, budgets.total);
  return fired;
}

/* ================= 월말 예측 ================= */
function renderForecast(expItems, exp, inc) {
  const state = monthState();
  if (state === 'future') { $('forecast').innerHTML = '<div class="empty">아직 시작되지 않은 달입니다.</div>'; return; }
  const days = daysInMonth();
  const cutoff = state === 'current' ? new Date().getDate() : days;
  const daily = Array(days).fill(0);
  expItems.forEach(i => daily[Number(i.date.slice(8, 10)) - 1] += i.amount);
  const cum = []; daily.reduce((s, v, i) => (cum[i] = s + v), 0);
  const spentToDate = cum[cutoff - 1];
  // 월세·통신비 같은 고정지출은 한 번만 나가므로 일평균 계산에서 제외
  const upToToday = expItems.filter(i => Number(i.date.slice(8, 10)) <= cutoff);
  const fixed = upToToday.filter(i => FIXED_CATS.includes(i.category)).reduce((s, i) => s + i.amount, 0);
  const avg = (spentToDate - fixed) / cutoff;
  const projected = state === 'current' ? Math.max(exp, Math.round(fixed + avg * days)) : exp;
  const budget = budgets.total || 0;

  let third;
  if (budget) {
    const diff = budget - projected;
    third = diff >= 0
      ? `<div class="m"><span>예산 대비</span><strong class="c-income">${won(diff)} 여유</strong></div>`
      : `<div class="m"><span>예산 대비</span><strong class="c-expense">${won(-diff)} 초과</strong></div>`;
  } else {
    const nb = inc - projected;
    third = `<div class="m"><span>예상 월말 잔액</span><strong class="${nb < 0 ? 'c-expense' : 'c-income'}">${won(nb)}</strong></div>`;
  }

  // SVG 차트
  const W = 600, H = 200, L = 6, R = 6, T = 12, B = 24;
  const maxY = Math.max(projected, budget, spentToDate, 1) * 1.12;
  const x = d => L + d / days * (W - L - R);
  const y = v => T + (1 - v / maxY) * (H - T - B);
  let line = `M${x(0)},${y(0)}`;
  for (let d = 1; d <= cutoff; d++) line += ` L${x(d)},${y(cum[d - 1])}`;
  const area = `${line} L${x(cutoff)},${y(0)} Z`;
  const ticks = [1, 10, 20, days].map(d => `<text x="${x(d)}" y="${H - 6}" text-anchor="${d === days ? 'end' : 'middle'}">${d}일</text>`).join('');
  const gridLines = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(maxY * f / 1.12)}" y2="${y(maxY * f / 1.12)}" stroke="rgba(0,240,255,.07)"/>`).join('');

  $('forecast').innerHTML = `
    <div class="fc-metrics">
      <div class="m"><span>${state === 'current' ? '예상 월말 지출' : '월 총 지출 (마감)'}</span><strong>${won(projected)}</strong></div>
      <div class="m"><span>하루 평균 (변동지출)</span><strong>${won(avg)}</strong></div>
      ${third}
    </div>
    <div class="fc-chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="누적 지출 추이">
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#00f0ff" stop-opacity=".35"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        ${gridLines}
        <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(0,240,255,.25)"/>
        ${budget ? `<line x1="${L}" x2="${W - R}" y1="${y(budget)}" y2="${y(budget)}" stroke="#ffcc00" stroke-dasharray="6 5" stroke-width="1.5"/>
                    <text x="${W - R}" y="${y(budget) - 6}" text-anchor="end" fill="#ffcc00" font-size="11" font-family="JetBrains Mono, monospace">예산 ${won(budget)}</text>` : ''}
        <path d="${area}" fill="url(#ga)"/>
        <path d="${line}" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)" stroke-linejoin="round"/>
        ${state === 'current' ? `
          <line x1="${x(cutoff)}" y1="${y(spentToDate)}" x2="${x(days)}" y2="${y(projected)}" stroke="#ff2bd6" stroke-width="2.5" stroke-dasharray="7 6" filter="url(#glow)"/>
          <circle cx="${x(days)}" cy="${y(projected)}" r="4" fill="#ff2bd6" filter="url(#glow)"/>
          <line x1="${x(cutoff)}" x2="${x(cutoff)}" y1="${T}" y2="${y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 4"/>
          <circle cx="${x(cutoff)}" cy="${y(spentToDate)}" r="5" fill="#03040a" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
          <text x="${x(cutoff)}" y="${T + 2}" text-anchor="middle" fill="#e8f6ff" font-size="11" font-family="JetBrains Mono, monospace">TODAY</text>` : ''}
        <g fill="#7d8ba3" font-size="11" font-family="JetBrains Mono, monospace">${ticks}</g>
      </svg>
    </div>
    <div class="fc-legend">
      <span><i style="background:#00f0ff"></i>누적 지출</span>
      ${state === 'current' ? '<span><i style="background:#ff2bd6"></i>예측</span>' : ''}
      ${budget ? '<span><i style="background:#ffcc00"></i>전체 예산</span>' : ''}
    </div>
    ${state === 'current' ? '<div class="note">고정지출(주거/통신)은 그대로 두고, 나머지 지출의 하루 평균 속도가 월말까지 이어진다고 가정한 예측입니다.</div>' : ''}`;
}

/* ================= 이벤트 ================= */
document.addEventListener('input', e => {
  if (!e.target.classList.contains('money')) return;
  const n = parseMoney(e.target.value);
  e.target.value = n ? fmt(n) : '';
});

document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', fillCategories));

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const amount = parseMoney($('amount').value);
  if (!amount) { $('amount').focus(); return; }
  const btn = $('form').querySelector('button[type=submit]');
  btn.disabled = true;
  const row = { type: getType(), date: $('date').value, category: $('category').value, amount, memo: $('memo').value.trim() };
  const { data, error } = await sb.from('transactions').insert(row).select(COLS).single();
  btn.disabled = false;
  if (error) { toast('저장 실패: ' + error.message, 'danger'); return; }
  const item = fromRow(data);
  items.push(item);
  const [y, m] = item.date.split('-').map(Number);
  current = new Date(y, m - 1, 1);
  $('amount').value = ''; $('memo').value = ''; $('amount').focus();
  if (!budgetAlerts(item)) toast(`${item.type === 'income' ? '+' : '−'}${won(item.amount)} 기록 완료`);
  render();
});

$('list').addEventListener('click', async e => {
  const btn = e.target.closest('.del');
  if (!btn || !confirm('이 내역을 삭제할까요?')) return;
  const { error } = await sb.from('transactions').delete().eq('id', btn.dataset.id);
  if (error) { toast('삭제 실패: ' + error.message, 'danger'); return; }
  items = items.filter(i => String(i.id) !== btn.dataset.id);
  render();
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f; render();
}));

$('prev').onclick = () => { current.setMonth(current.getMonth() - 1); render(); };
$('next').onclick = () => { current.setMonth(current.getMonth() + 1); render(); };

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ items, budgets }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `가계부_${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const newItems = Array.isArray(data) ? data : data.items;   // 이전 버전 백업도 지원
      if (!Array.isArray(newItems)) throw new Error('올바른 백업 파일이 아닙니다.');
      if (confirm(`${newItems.length}건을 불러옵니다. 기존 데이터는 덮어씁니다. 계속할까요?`)) {
        const del = await sb.from('transactions').delete().not('id', 'is', null);
        if (del.error) throw del.error;
        items = [];
        if (newItems.length) {
          const { data: ins, error } = await sb.from('transactions').insert(newItems.map(toRow)).select(COLS);
          if (error) throw error;
          items = ins.map(fromRow);
        }
        if (data.budgets) await saveBudgets(data.budgets);
        toast('백업을 불러왔습니다.'); render();
      }
    } catch (err) { toast('불러오기 실패: ' + (err.message || '올바른 백업 파일이 아닙니다.'), 'danger'); render(); }
    e.target.value = '';
  };
  reader.readAsText(file);
};
$('clearBtn').onclick = async () => {
  if (!confirm('모든 내역과 예산을 삭제할까요? 되돌릴 수 없습니다.')) return;
  const r1 = await sb.from('transactions').delete().not('id', 'is', null);
  const r2 = await sb.from('budgets').delete().eq('id', 1);
  if (r1.error || r2.error) { toast('초기화 실패: ' + (r1.error || r2.error).message, 'danger'); return; }
  items = []; budgets = { total: 0, cats: {} };
  render();
};

/* ================= 배경음악 (Web Audio로 실시간 연주하는 오리지널 신스웨이브) ================= */
const BGM = (() => {
  const BPM = 100, STEP = 60 / BPM / 4;                       // 16분음표 길이(초)
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];  // Am - F - C - G
  const BASS = [45, 41, 48, 43];
  const LEAD = [76, null, 72, null, 74, 76, null, 79, 77, null, 76, null, 72, null, 74, null];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let ctx, master, arpBus, noise, timer, step = 0, nextTime = 0, playing = false;

  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    // 아르페지오용 에코
    arpBus = ctx.createGain();
    const delay = ctx.createDelay(); delay.delayTime.value = STEP * 3;
    const fb = ctx.createGain(); fb.gain.value = 0.35;
    arpBus.connect(master); arpBus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(master);
    // 하이햇용 화이트 노이즈
    noise = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function tone(type, freq, t, dur, vol, dest, cutoff, attack = 0.005) {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
  }
  function hat(t, vol) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.06);
  }

  function play(s, t) {
    const bar = Math.floor(s / 16) % 4, i = s % 16, ch = CHORDS[bar];
    if (i % 4 === 0) kick(t);
    hat(t, i % 4 === 2 ? 0.12 : 0.035);
    if (i % 2 === 0) tone('sawtooth', hz(BASS[bar] + (i % 4 === 2 ? 12 : 0)), t, STEP * 1.8, 0.13, master, 500);
    tone('square', hz(ch[i % 3] + 12 + (i % 6 >= 3 ? 12 : 0)), t, STEP * 0.9, 0.03, arpBus, 2600);
    if (i === 0) ch.forEach(m => tone('sawtooth', hz(m), t, STEP * 16, 0.025, master, 1400, 0.6));
    // 8마디 중 뒤 4마디에만 멜로디
    const lead = LEAD[i];
    if (Math.floor(s / 64) % 2 === 1 && lead) tone('triangle', hz(lead), t, STEP * 3, 0.07, arpBus, 3000, 0.02);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.15) {
      play(step, nextTime);
      nextTime += STEP; step = (step + 1) % 128;
    }
  }

  return {
    get playing() { return playing; },
    async start() {
      if (playing) return;
      if (!ctx) init();
      await ctx.resume();
      playing = true;
      nextTime = ctx.currentTime + 0.05;
      clearInterval(timer); timer = setInterval(schedule, 25);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0.4, ctx.currentTime, 0.4);
    },
    stop() {
      if (!playing) return;
      playing = false;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
      setTimeout(() => { if (!playing) { clearInterval(timer); ctx.suspend(); } }, 600);
    }
  };
})();

// 배경음악은 항상 꺼진 상태로 시작 (버튼을 눌러야 재생)
let bgmWanted = false;

function updateBgmBtn() {
  $('bgmBtn').classList.toggle('on', BGM.playing);
  $('bgmBtn').title = BGM.playing ? '배경음악 끄기' : '배경음악 켜기';
}
$('bgmBtn').onclick = async () => {
  if (BGM.playing) BGM.stop(); else await BGM.start();
  bgmWanted = BGM.playing;
  updateBgmBtn();
};
// 다른 탭으로 가면 잠시 멈추고, 돌아오면 다시 재생
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { if (BGM.playing) BGM.stop(); }
  else if (bgmWanted && !BGM.playing) { await BGM.start(); }
  updateBgmBtn();
});

// 시계
const tick = () => { const d = new Date(); $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
tick(); setInterval(tick, 1000);

$('date').value = ymd(new Date());
fillCategories();
render();
loadData();
</script>
